<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur-md">
  <nav aria-label="Primary navigation" class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <div class="flex min-w-0 items-center gap-8">
      <a href="{% url 'tracker:home' %}" class="flex shrink-0 items-center gap-2.5 rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-indigo-600" aria-label="RecruiterHub home">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-sm shadow-indigo-200">
          <svg aria-hidden="true" focusable="false" class="h-5 w-5" viewBox="0 0 24 24" fill="none">
            <path d="M4 8.5 12 4l8 4.5-8 4.5L4 8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m4 12 8 4.5 8-4.5M4 15.5 12 20l8-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="truncate text-base font-semibold tracking-tight text-slate-900">RecruiterHub</span>
      </a>
      <a href="{% url 'tracker:job_list' %}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
        Job Board
      </a>
    </div>

    {% if request.user.is_authenticated %}
      <div class="flex shrink-0 items-center gap-3">
        {% if request.user.is_staff %}
          <a href="{% url 'admin:index' %}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
            Admin
          </a>
        {% endif %}
        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-100 text-sm font-semibold text-indigo-700" aria-hidden="true">
          {{ request.user.get_username|slice:":1"|upper }}
        </span>
        <span class="hidden max-w-40 truncate text-sm font-medium text-slate-700 sm:block">
          {{ request.user.get_username }}
        </span>
      </div>
    {% endif %}
  </nav>
</header>
